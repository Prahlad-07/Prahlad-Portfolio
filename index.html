<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
<!--    <link rel="icon" type="image/svg+xml" href="/vite.svg" />-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f4ec" />
    <script>
      (() => {
        try {
          const storageKey = 'portfolio-theme';
          const storedTheme = window.localStorage.getItem(storageKey);

          // Dev-only: when running on localhost, clear an existing 'dark' preference
          // so the app boots in light mode for development/testing.
          if (
            storedTheme === 'dark' &&
            (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
          ) {
            window.localStorage.removeItem(storageKey);
          }

          const storedAfterRemoval = window.localStorage.getItem(storageKey);
          const resolvedTheme =
            storedAfterRemoval === 'light' || storedAfterRemoval === 'dark'
              ? storedAfterRemoval
              : 'light';

          const root = document.documentElement;
          root.dataset.theme = resolvedTheme;
          root.style.colorScheme = resolvedTheme;

          const themeColorMeta = document.querySelector('meta[name="theme-color"]');
          if (themeColorMeta) {
            themeColorMeta.setAttribute(
              'content',
              resolvedTheme === 'dark' ? '#0d1117' : '#f8f4ec',
            );
          }

          // Helpful debug log during development
          if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
            // eslint-disable-next-line no-console
            console.log('Theme bootstrap resolved:', resolvedTheme, 'stored:', storedAfterRemoval);
          }
        } catch (error) {
          // eslint-disable-next-line no-console
          console.error('Theme bootstrap failed:', error);
        }
      })();
    </script>
    <title>Prahlad Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/main.jsx"></script>
  </body>
</html>
