<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e1e1e" />
    <meta
      name="description"
      content="Prahlad Yadav — Full-Stack Engineer. Backend-first. Portfolio built as a code editor."
    />
    <script>
      (() => {
        try {
          const storageKey = 'portfolio-theme';
          const stored = window.localStorage.getItem(storageKey);
          const resolved = stored === 'light' || stored === 'dark' ? stored : 'dark';

          const root = document.documentElement;
          root.dataset.theme = resolved;
          root.style.colorScheme = resolved;

          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#1e1e1e' : '#ffffff');
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <title>Prahlad Yadav — ~/portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/main.jsx"></script>
  </body>
</html>
